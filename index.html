<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>We Met In August?!</title>
  <link rel="stylesheet" href="css/hero.css">
</head>
<body class="hero-page">
  <div class="hero-container">
    <!-- STRIPES will be generated by JS for precise control (60+ vibrant blues) -->
    <div class="hero-stripes" id="hero-stripes"></div>

    <!-- FLOATING QUESTION MARKS -->
    <div class="question-marks" id="qmark-container" aria-hidden="true"></div>

    <!-- LOGO CENTER -->
    <div class="hero-logo" role="img" aria-label="We Met In August logo">?!</div>

    <!-- TITLE -->
    <h1 class="hero-title">We Met In August?!</h1>

    <!-- SUBTITLE -->
    <p class="hero-subtitle">Exploring how humanity has understood the universe and our place within it through science, history, and art.</p>

    <!-- SCROLL HINT -->
    <div class="hero-scroll">↓ SCROLL ↓</div>
  </div>

  <script>
    // Palette: 64 thoughtfully chosen blues (light -> dark). You asked for many blues; this set mixes cobalt, navy, midnight, blueberry, indigo, sapphire, cerulean, prussian and more.
    const blues = [
      '#f3fbff','#e6f7ff','#d9f2ff','#ccedff','#c0e8ff','#b3e3ff','#a6deff','#99d9ff',
      '#8ccfff','#80c6ff','#73bdff','#66b4ff','#59abff','#4da2ff','#4099ff','#338fff',
      '#2b86ff','#247bff','#1d72ff','#1669ff','#0f60ff','#0857ff','#004ef7','#0047df',
      '#0040c7','#0039af','#003197','#002b7f','#002467','#001f4f','#001a3f','#00142f',
      '#0047AB','#003E99','#003587','#002C75','#002363','#001A51','#00113F','#00082D',
      '#0F2B4C','#102A55','#132A5E','#162866','#191970','#08163F','#07102E','#050A1D',
      '#eaf2ff','#dfe9ff','#d4e0ff','#c9d7ff','#bed0ff','#b3c8ff','#a8c0ff','#9db8ff',
      '#93b0ff','#8898ff','#7e90ff','#7388ff','#6880ff','#5d78ff','#526fff','#4767ff',
      '#3c5fff','#3147ff','#273fff','#1d37ff','#1330ff','#0928e6','#001fcc','#0015b3'
    ];

    const stripesContainer = document.getElementById('hero-stripes');
    const count = 64; // number of stripes to generate
    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      s.className = 'stripe';
      const color = blues[i % blues.length];
      s.style.background = color;
      // black thin border to create thin separators as you requested
      s.style.borderLeft = '1px solid rgba(0,0,0,0.25)';
      stripesContainer.appendChild(s);
    }

    // Floating pixel-style symbols (?!). Smaller, more subtle, with slight parallax.
    const qContainer = document.getElementById('qmark-container');
    const symbols = ['?!','?','!','!?'];
    const numSymbols = 36;
    for (let i = 0; i < numSymbols; i++) {
      const el = document.createElement('div');
      el.className = 'qmark';
      el.textContent = symbols[Math.floor(Math.random()*symbols.length)];
      el.style.left = (10 + Math.random()*80) + '%';
      el.style.top = (5 + Math.random()*85) + '%';
      el.style.fontSize = (12 + Math.random()*26) + 'px';
      el.style.opacity = 0.18 + Math.random()*0.5;
      el.style.transform = `translateZ(${(Math.random()*20-10)}px)`;
      el.style.animationDelay = (Math.random()*6) + 's';
      qContainer.appendChild(el);
    }

    // Accessibility: allow keyboard skip
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey && e.key.toLowerCase() === 's') || (e.key === 'S' && e.ctrlKey)) {
        const main = document.querySelector('.hero-title');
        if (main) main.focus();
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
