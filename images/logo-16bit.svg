<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256">
  <!-- 16-bit pixelated ?! logo, transparent background -->
  <rect width="100%" height="100%" fill="transparent"/>
  <g stroke="#000000" stroke-width="0" fill="#FFFFFF">
    <!-- question mark (left) -->
    <rect x="6" y="4" width="4" height="2" />
    <rect x="10" y="6" width="2" height="2" />
    <rect x="10" y="8" width="2" height="2" />
    <rect x="8" y="10" width="2" height="2" />
    <rect x="6" y="12" width="2" height="2" />
    <rect x="6" y="14" width="2" height="2" />
    <rect x="8" y="16" width="2" height="2" />
    <rect x="10" y="18" width="2" height="2" />
    <rect x="6" y="22" width="2" height="2" />
    <!-- exclamation mark (right) -->
    <rect x="20" y="4" width="2" height="12" />
    <rect x="20" y="18" width="2" height="2" />
  </g>
</svg>
