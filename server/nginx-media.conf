# nginx media snippet

Include this into your nginx `server` block (adjust paths as needed):

```
location /media/ {
  root /var/www/your-site/public; # adjust
  add_header Access-Control-Allow-Origin "*";
  types {
    application/vnd.apple.mpegurl m3u8;
    video/mp2t ts;
    video/mp4 mp4;
    text/vtt vtt;
  }
  expires 1d;
}
```
